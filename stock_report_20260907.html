const dates = Object.keys(DATA);

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function riskClass(diag) {
  if (diag.startsWith('低风险')) return 'low';
  if (diag.startsWith('中风险')) return 'mid';
  if (diag.startsWith('中高风险')) return 'midhigh';
  if (diag.startsWith('高风险')) return 'high';
  return 'na';
}

function render(date) {
  const rows = DATA[date] || [];
  // 日期选择器
  const sel = document.getElementById('dateSelect');
  sel.innerHTML = dates.map(d => `<option value="${d}"${d===date?' selected':''}>${d}</option>`).join('');
  document.getElementById('dateCount').textContent = `共 ${dates.length} 个交易日存档`;
  document.getElementById('tableTitle').textContent = `（${date}，${rows.length} 只）`;

  // 摘要卡片
  const riskCnt = {'低风险':0,'中风险':0,'中高风险':0,'高风险':0,'待评估':0};
  const sectorCnt = {};
  rows.forEach(r => {
    const k = r.diag.split(' | ')[0];
    riskCnt[k] = (riskCnt[k]||0) + 1;
    const sec = r.sector.split(' / ')[0];
    sectorCnt[sec] = (sectorCnt[sec]||0) + 1;
  });
  const cards = [
    ['入选股票', rows.length, '#1f6feb'],
    ['低风险', riskCnt['低风险'], '#2da44e'],
    ['中风险', riskCnt['中风险'], '#bf8700'],
    ['中高风险', riskCnt['中高风险'], '#d4760a'],
    ['覆盖板块', Object.keys(sectorCnt).length, '#8250df'],
  ];
  document.getElementById('cards').innerHTML = cards.map(c =>
    `<div class='card' style='border-top:4px solid ${c[2]}'><div class='card-num'>${c[1]}</div><div class='card-title'>${c[0]}</div></div>`
  ).join('');

  // 板块条形
  const topSec = Object.entries(sectorCnt).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const maxC = Math.max(1, ...topSec.map(x=>x[1]));
  document.getElementById('sectors').innerHTML = topSec.map(([n,c]) =>
    `<div class='sector-row'><span class='sector-name'>${esc(n)}</span>` +
    `<span class='sector-bar-wrap'><span class='sector-bar' style='width:${Math.round(c/maxC*100)}%'></span></span>` +
    `<span class='sector-cnt'>${c}</span></div>`
  ).join('') || '<p>暂无数据</p>';

  // 行模板(主表与RSI子表共用)
  function rowHtml(r) {
    const chg = r.chg;
    const chgCls = chg > 0 ? 'up' : (chg < 0 ? 'down' : 'flat');
    const riskLabel = r.diag.split(' | ')[0];
    let nextTd = "<td class='chg flat'>—</td>";
    if (r.next_chg != null && !isNaN(r.next_chg)) {
      const nCls = r.next_chg > 0 ? 'up' : (r.next_chg < 0 ? 'down' : 'flat');
      const nSign = r.next_chg > 0 ? '+' : '';
      nextTd = `<td class='chg ${nCls}'>${nSign}${r.next_chg.toFixed(2)}%</td>`;
    }
    return `<tr>
      <td class='mono'>${esc(r.code)}</td>
      <td class='name'>${esc(r.name)}</td>
      <td><button class='cpy' data-name='${esc(r.name)}'>复制</button></td>
      <td>${esc(r.sector)}</td>
      <td class='theme hide-mobile' title='${esc(r.theme)}'>${esc(r.theme)}</td>
      <td class='chg ${chgCls}'>${chg>0?'+':''}${chg.toFixed(2)}%</td>
      ${nextTd}
      <td class='mono'>${r.price.toFixed(2)}</td>
      <td class='mono'>${r.pe.toFixed(1)}</td>
      <td class='mono'>${esc(r.c10)}</td>
      <td><details class='diag'><summary><span class='tag ${riskClass(r.diag)}'>${esc(riskLabel)}</span></summary><div class='diag-detail'>${esc(r.diag)}</div></details></td>
    </tr>`;
  }

  // 主表
  const tbody = document.querySelector('#stockTable tbody');
  tbody.innerHTML = rows.map(rowHtml).join('');

  // RSI6 > RSI12 且昨日缩量 子表(仅在有数据时显示)
  const rsiRows = rows.filter(r => r.rsi6 != null && r.rsi12 != null && r.rsi6 > r.rsi12 && r.shrink);
  const rsiTitle = document.getElementById('rsiTitle');
  const rsiWrap = document.getElementById('rsiWrap');
  if (rsiRows.length) {
    rsiTitle.style.display = '';
    rsiWrap.style.display = '';
    document.getElementById('rsiCount').textContent = `（${date}，${rsiRows.length} 只）`;
    document.querySelector('#rsiTable tbody').innerHTML = rsiRows.map(rowHtml).join('');
  } else {
    rsiTitle.style.display = 'none';
    rsiWrap.style.display = 'none';
  }
}

// 日期切换
document.getElementById('dateSelect').addEventListener('change', e => {
  document.getElementById('search').value = '';
  render(e.target.value);
});

// 复制股票名称(事件委托)
document.addEventListener('click', e => {
  const btn = e.target.closest('.cpy');
  if (!btn) return;
  const name = btn.getAttribute('data-name');
  const done = () => {
    btn.textContent = '✅已复制';
    btn.classList.add('done');
    setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('done'); }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(name).then(done).catch(() => { fallbackCopy(name); done(); });
  } else { fallbackCopy(name); done(); }
});
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
}

// 搜索过滤
document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('#stockTable tbody tr').forEach(tr => {
    tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
});

// 默认渲染最新日期
render(dates[0]);
</script>
